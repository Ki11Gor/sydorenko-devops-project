name: Study Planner CI/CD

on:
  push:
    branches:
      - main
      - 'project/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-planner-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: students/sydorenko

jobs:
  image:
    name: Test API and Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run API tests
        run: npm ci --no-audit --no-fund && npm test

      - name: Build and test commit image
        run: |
          image="study-planner:$GITHUB_SHA"
          docker build --tag "$image" .
          trap 'docker logs study-planner-check; docker rm -f study-planner-check >/dev/null 2>&1 || true' EXIT
          docker run --rm --detach --name study-planner-check \
            --publish 127.0.0.1:3000:3000 "$image"
          test "$(docker exec study-planner-check id -u)" != 0
          curl -fsS --retry 8 --retry-all-errors --max-time 3 http://127.0.0.1:3000/health \
            | jq -e '.status == "ok"'
          curl -fsS 'http://127.0.0.1:3000/api/plan?topics=10&perDay=3&minutes=25' \
            | jq -e '.days == 4 and .totalMinutes == 250 and .schedule[-1].topics == 1'
          printf 'Docker verified the study plan for %s.\n' "$image"

      - name: Check Docker Hub configuration
        id: dockerhub
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [[ -z "$DOCKER_USERNAME" && -z "$DOCKER_TOKEN" ]]; then
            printf '%s\n' 'Set DOCKER_USERNAME and DOCKER_TOKEN to publish to Docker Hub.'
            exit 0
          fi
          : "${DOCKER_USERNAME:?Set the Docker Hub username}"
          : "${DOCKER_TOKEN:?Set the Docker Hub access token}"
          printf 'configured=true\n' >> "$GITHUB_OUTPUT"

      - name: Push tested image to Docker Hub
        id: publish
        if: steps.dockerhub.outputs.configured == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]]
          push_log=$(mktemp)
          trap 'rm -f -- "$push_log"; docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          image="$DOCKER_USERNAME/study-planner:$GITHUB_SHA"
          docker tag "study-planner:$GITHUB_SHA" "$image"
          docker push "$image" | tee "$push_log"
          digest=$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+.*/\1/p' "$push_log" | tail -n 1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  terraform:
    name: Validate Terraform and test with mock AWS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: students/sydorenko/infra
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false

      - name: Check Terraform format and configuration
        run: |
          terraform fmt -check -recursive -diff
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Test EC2 plan and apply without AWS resources
        run: terraform test -no-color

  deploy:
    name: Provision and deploy on EC2
    needs: [image, terraform]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false

      - name: Apply infrastructure and deploy the published image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_PAGER: ''
          TF_IN_AUTOMATION: 'true'
          TF_INPUT: '0'
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: sydorenko-devops-project/study-planner.tfstate
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_key_name: ${{ vars.EC2_KEY_NAME }}
          TF_VAR_app_cidr: ${{ vars.APP_CIDR }}
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set the AWS_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the AWS_SECRET_ACCESS_KEY secret}"
          : "${TF_STATE_BUCKET:?Set an existing private S3 state bucket}"
          : "${TF_VAR_key_name:?Set EC2_KEY_NAME}"
          : "${TF_VAR_app_cidr:?Set APP_CIDR}"
          : "${EC2_SSH_KEY_B64:?Set the EC2_SSH_KEY_B64 secret}"
          : "${IMAGE_DIGEST:?Publish the image to Docker Hub before deploying}"

          umask 077
          plan="$RUNNER_TEMP/study-planner.tfplan"
          trap 'rm -f -- "$plan"' EXIT
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_DEFAULT_REGION" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra plan -no-color -lock-timeout=120s -out="$plan"
          terraform -chdir=infra apply -no-color -lock-timeout=120s "$plan"

          EC2_INSTANCE_ID=$(terraform -chdir=infra output -raw instance_id)
          EC2_IP=$(terraform -chdir=infra output -raw instance_ip)
          SECURITY_GROUP_ID=$(terraform -chdir=infra output -raw security_group_id)
          export EC2_INSTANCE_ID EC2_IP SECURITY_GROUP_ID
          bash .github/deploy-ec2.sh
          printf 'EC2 deployment checked for %s.\n' "$GITHUB_SHA"
